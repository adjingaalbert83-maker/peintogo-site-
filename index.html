<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PeinTogo Association | Peinture & Finitions</title>

<meta name="description" content="PeinTogo Association - Peinture, rénovation et finitions au Togo.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
  line-height:1.6;
  background:#fff;
}

:root{
  --turquoise:#087f8c;
  --red:#e53935;
  --dark:#10191e;
  --light:#f4f7f8;
}

.container{
  width:90%;
  max-width:1150px;
  margin:auto;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(16,25,30,.97);
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.nav{
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand img{
  width:150px;
  max-height:65px;
  object-fit:contain;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

nav a:hover{
  color:#10a6a6;
}

/* HERO */
.hero{
  min-height:90vh;
  display:flex;
  align-items:center;
  text-align:center;
  color:white;

  background:
  linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
  url('images/realisation-1.jpg') center/cover no-repeat;
}

.hero-content{
  width:100%;
}

.hero h1{
  font-size:clamp(2.5rem,6vw,5rem);
  margin-bottom:20px;
  text-transform:uppercase;
}

.hero h1 span{
  color:#10a6a6;
}

.hero p{
  font-size:1.3rem;
  margin-bottom:12px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 25px;
  border-radius:8px;
  background:var(--red);
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* SECTIONS */
section{
  padding:80px 0;
}

.section-head{
  text-align:center;
  margin-bottom:45px;
}

.section-head h2{
  color:var(--turquoise);
  font-size:2.2rem;
  margin-bottom:10px;
}

.section-head p{
  color:#666;
}

/* ABOUT */
.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.about h2{
  color:var(--turquoise);
  margin-bottom:20px;
}

.about p{
  margin-bottom:15px;
}

/* SERVICES */
.services{
  background:var(--light);
}

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card .icon{
  font-size:45px;
  margin-bottom:15px;
}

.card h3{
  color:var(--turquoise);
  margin-bottom:10px;
}

/* GALERIE */
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.gallery img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:12px;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.03);
}

/* CONTACT */
.contact{
  background:var(--dark);
  color:white;
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.contact-box{
  background:rgba(255,255,255,.08);
  padding:30px;
  border-radius:15px;
}

.contact h2{
  color:#10a6a6;
  margin-bottom:20px;
}

.contact p{
  margin-bottom:12px;
}

.contact a{
  color:white;
}
