<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PeinTogo Association | Peinture & Finitions</title>

<meta name="description" content="PeinTogo Association - Peinture, rénovation et finitions au Togo.">

<link rel="icon" href="images/logo-peintogo.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
    background: #fff;
    line-height: 1.6;
}

header {
    background: #10191e;
    padding: 15px 0;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    width: 150px;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;

    background:
    linear-gradient(rgba(0,0,0,.60), rgba(0,0,0,.60)),
    url("images/realisation-1.jpg") center/cover no-repeat;
}

.hero h1 {
    font-size: 60px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #10a6a6;
}

.hero p {
    font-size: 20px;
    margin: 8px 0;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 25px;
    background: #e53935;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

section {
    padding: 70px 0;
}

.title {
    text-align: center;
    margin-bottom: 40px;
}

.title h2 {
    color: #087f8c;
    font-size: 35px;
}

.about {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
}

.about img {
    width: 100%;
    border-radius: 15px;
}

.services {
    background: #f4f7f8;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

.card h3 {
    color: #087f8c;
    margin: 15px 0;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.gallery img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 12px;
}

.contact {
    background: #10191e;
    color: white;
}

.contact h2 {
    color: #10a6a6;
}

.contact a {
    color: white;
}

.contact-box {
    text-align: center;
}

footer {
    background: #080e11;
    color: #aaa;
    text-align: center;
    padding: 25px;
}

.whatsapp {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 25px;
}

@media (max-width: 800px) {

    .nav {
        flex-direction: column;
    }

    nav {
        justify-content: center;
    }

    .about {
        grid-template-columns: 1fr;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero h1 {
        font-size: 42px;
    }
}

@media (max-width: 500px) {

    .gallery {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 35px;
    }
}
</style>

  </head>
